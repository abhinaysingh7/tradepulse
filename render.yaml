# TradePulse — Render Blueprint Specification
# Free Tier Deployment: Frontend Static Site + Backend Web Service
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express)
  # -------------------------------------------------------------
  - type: web
    name: tradepulse-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FINNHUB_API_KEY
        sync: false # Set securely in Render Dashboard
      - key: CORS_ORIGIN
        value: "*"

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: tradepulse-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # SPA fallback routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to backend URL (e.g. https://tradepulse-backend.onrender.com)
